<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>わあどる</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="4文字のひらがな単語を当てるゲームです。" />
  <link rel="stylesheet" href="css/style.css" />

  <!-- Theme initializer (runs before paint to avoid flash) -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("waadoru-theme");
        if (theme === "dark") document.documentElement.dataset.theme = "dark";
      } catch (e) {
        // ignore storage errors
      }
    })();
  </script>
</head>
<body>
  <div id="app">
    <header>
      <h1>わあどる</h1>
      <button id="theme-toggle" type="button" aria-label="ダークモード切替" title="テーマ切替">
        <span class="theme-icon" aria-hidden="true"></span>
      </button>
    </header>

    <main id="board" role="region" aria-label="ゲームボード"></main>

    <nav id="keyboard" aria-label="仮名キーボード"></nav>

    <footer>
      <p class="rules">
        緑：正しい位置　黄：含まれるが位置違い　灰：含まれない
      </p>
      <p class="copyright">&copy; 2026 ShionGT. All Rights Reserved.</p>
    </footer>

    <!-- Toast for validation messages -->
    <div id="toast" role="status" aria-live="polite" class="toast hidden"></div>

    <!-- Victory modal -->
    <dialog id="victory-modal">
      <h2 id="victory-heading">正解！</h2>
      <p id="victory-answer"></p>
      <p id="attempt-count"></p>
      <menu>
        <button id="close-victory" type="button">閉じる</button>
        <button id="play-again" type="button" autofocus>もう一度</button>
      </menu>
    </dialog>

    <!-- Hidden input for physical keyboard / IME -->
    <input type="text" id="physical-input" aria-hidden="true" autocomplete="off" spellcheck="false" inputmode="text" />
  </div>

  <!-- hiragana map (classic script, sets globalThis.hiraganas) -->
  <script src="js/hiragana.js"></script>
  <!-- Main game logic as ES module -->
  <script type="module" src="js/script.js"></script>
</body>
</html>
